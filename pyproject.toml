
[project]
name = "dataflow-nexus"
version = "0.1.0"
description = "End-to-end data engineering platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

markers = [
    "integration: tests requiring external services",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
